name: Ghost Agent E2E Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  ghost-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [happy_path, low_data, api_failure_fallback, adversarial_input]
    env:
      GHOST_MODE: "true"
      DRY_RUN: "true"
      ALLOW_SIDE_EFFECTS: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ghost harness
        run: |
          python scripts/ghost_harness.py \
            --scenario "${{ matrix.scenario }}" \
            --output-dir ghost-artifacts

      - name: Summarize ghost run
        if: always()
        run: |
          REPORT="ghost-artifacts/${{ matrix.scenario }}/ghost_summary.md"
          echo "### Ghost Test - ${{ matrix.scenario }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report missing: $REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ghost artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.scenario }}-${{ github.run_id }}
          path: ghost-artifacts/${{ matrix.scenario }}/
          retention-days: 14
