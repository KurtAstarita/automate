# Refresh Check Workflow
#
# Runs the Site Intelligence Agent weekly to identify one post candidate for
# refresh, then creates a GitHub issue for CEO approval.
#
# Schedule: every Monday at 07:00 UTC.
# Approval flow: the created issue contains /approve, /reject, /revise commands
#                that the Approval Agent listens for (see approval_agent.py).
#
# Required repository secrets:
#   GSC_DATA_JSON              – (optional) JSON array of Google Search Console post metrics.
#                                If absent, the agent falls back to its built-in sample data.
#   GOOGLE_SERVICE_ACCOUNT_JSON – Service account JSON used for GA4 (and optionally GSC).
#   GA4_PROPERTY_ID            – GA4 numeric property id (e.g. "123456789").
#
# The workflow can also be triggered manually with an optional GSC data override.

name: Weekly Refresh Check

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      gsc_data_json:
        description: >
          JSON array of GSC post metrics to override the default data.
          Each item: { url_slug, title, published_date, position, impressions, clicks }
        required: false
        type: string
      ga4_lookback_days:
        description: "Number of days to look back for GA4 metrics (default: 28)"
        required: false
        type: string

jobs:
  refresh-check:
    name: Run Site Intelligence Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live GSC data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: "https://kurtastarita.com/"
          GSC_LOOKBACK_DAYS: "28"
        run: python scripts/gsc_fetcher.py || echo "GSC fetch failed — will fall back to GSC_DATA_JSON secret or sample data"

      - name: Run Site Intelligence Agent
        id: sia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback: allow callers to supply GSC data via secret or workflow input
          GSC_DATA_JSON: ${{ inputs.gsc_data_json || secrets.GSC_DATA_JSON || '' }}
          # GA4 configuration – reuse existing service account credential
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_LOOKBACK_DAYS: ${{ inputs.ga4_lookback_days || '28' }}
          SITEMAP_URL: "https://kurtastarita.com/sitemap.xml"
        run: python scripts/run_weekly_refresh.py

      - name: Create GitHub approval issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/create_github_issue.py refresh_result.json

      - name: Print refresh check summary
        if: always()
        run: |
          echo "### Refresh Check Result" >> $GITHUB_STEP_SUMMARY
          if [ -f refresh_result.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat refresh_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No result file generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload refresh result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-result-${{ github.run_id }}
          path: refresh_result.json
          retention-days: 14
