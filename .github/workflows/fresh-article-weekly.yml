name: Weekly Fresh Article

on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:
    inputs:
      editorial_seed_topics:
        description: "Comma-separated seed topics for the weekly topic picker"
        required: false
        type: string
      editorial_industry:
        description: "Industry context for the weekly article"
        required: false
        type: string

jobs:
  fresh-article:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly fresh article package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITORIAL_SEED_TOPICS: ${{ inputs.editorial_seed_topics || vars.EDITORIAL_SEED_TOPICS || 'content automation,seo automation,ai workflows,developer productivity' }}
          EDITORIAL_INDUSTRY: ${{ inputs.editorial_industry || vars.EDITORIAL_INDUSTRY || 'B2B SaaS' }}
          SITEMAP_URL: "https://kurtastarita.com/sitemap.xml"
        run: python scripts/run_weekly_fresh_article.py

      - name: Create GitHub approval issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_github_issue.py fresh_article_result.json

      - name: Print weekly article summary
        if: always()
        run: |
          echo "### Weekly Fresh Article" >> $GITHUB_STEP_SUMMARY
          if [ -f fresh_article_result.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat fresh_article_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No result file generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload fresh article artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-article-${{ github.run_id }}
          path: fresh_article_result.json
          retention-days: 14
