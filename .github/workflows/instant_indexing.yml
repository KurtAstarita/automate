name: Fast API Indexing

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours to check for new feed updates
  workflow_run:
    workflows: ["Reschedule Blogger Posts"] # Or your publish/build workflow name
    types: [completed]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests google-api-python-client google-auth feedparser

      - name: Trigger API Indexing
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_HOST: "kurtasterita.com"
          RSS_FEED_URL: "https://kurtasterita.com/feeds/posts/default"
        run: python scripts/fast_indexing.py
