name: Blogger Recirculation & Indexing Pipeline

on:
  schedule:
    # Runs at midnight UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  republish-and-index:
    name: Rotate Post Date and Ping APIs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth requests feedparser

      - name: Step 1 - Reschedule Oldest Blogger Post
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python reschedule_blogger.py

      - name: Step 2 - Wait for RSS Feed propagation
        run: sleep 30

      - name: Step 3 - Submit Updated Post to Google and IndexNow
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_HOST: "kurtasterita.com"
          RSS_FEED_URL: "https://kurtasterita.com/feeds/posts/default"
        run: python fast_indexing.py
